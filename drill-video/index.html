<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>WRI UAS — Live Feed</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --gray: #3A3C3C;
    --crimson: #EC2329;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #141515; overflow: hidden; }
  body { font-family: 'Epilogue', system-ui, sans-serif; color: #fff; }

  #stage { position: fixed; inset: 0; background: #141515; cursor: pointer; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }

  /* top bar */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    background: linear-gradient(to bottom, rgba(20,21,21,.85), rgba(20,21,21,0));
    pointer-events: none;
  }
  #liveBadge {
    display: flex; align-items: center; gap: 8px;
    background: var(--crimson); color: #fff;
    font-weight: 800; font-size: 14px; letter-spacing: 1.5px;
    padding: 5px 12px 5px 10px; border-radius: 4px;
  }
  #liveBadge.hold { background: var(--gray); }
  #liveBadge.hold .dot { animation: none; opacity: .5; }
  #liveBadge .dot {
    width: 9px; height: 9px; border-radius: 50%; background: #fff;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  #title { font-weight: 700; font-size: 16px; text-shadow: 0 1px 4px rgba(0,0,0,.7); }
  #clock { margin-left: auto; font-weight: 500; font-size: 14px; opacity: .85; font-variant-numeric: tabular-nums; text-shadow: 0 1px 4px rgba(0,0,0,.7); }

  /* sound chip */
  #soundChip {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    background: rgba(58,60,60,.92); border: 1px solid rgba(255,255,255,.25);
    padding: 9px 18px; border-radius: 999px;
    font-weight: 700; font-size: 14px; letter-spacing: .5px;
    transition: opacity .3s;
  }
  #soundChip.hidden { opacity: 0; pointer-events: none; }

  /* fullscreen button */
  #fsBtn {
    position: absolute; bottom: 16px; left: 16px;
    width: 38px; height: 38px; border-radius: 8px;
    background: rgba(58,60,60,.75); border: 1px solid rgba(255,255,255,.2);
    color: #fff; font-size: 18px; line-height: 36px; text-align: center;
    user-select: none;
  }

  /* QR overlay */
  #qrBox {
    position: absolute; bottom: 16px; right: 16px;
    background: #fff; color: var(--gray);
    border-radius: 10px; padding: 10px 10px 7px;
    text-align: center;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  #qrBox img { display: block; width: 128px; height: 128px; }
  #qrBox .cap { font-size: 11px; font-weight: 700; margin-top: 5px; letter-spacing: .3px; }
  @media (max-width: 700px) { #qrBox, #fsBtn { display: none; } }

  /* UAS minimap — drone positions from track.json, keyed to the video playhead.
     Hidden until track.json actually loads, so a set with no telemetry (or an
     older drill.mp4 with no track) just shows the plain player as before. */
  #mapBox {
    position: absolute; bottom: 16px; left: 16px; display: none;
    background: rgba(20,21,21,.86); border: 1px solid rgba(255,255,255,.16);
    border-radius: 10px; padding: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.5);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  #mapBox canvas { display: block; border-radius: 5px; }
  /* shown while the on-screen feed is an aircraft with no flight track */
  #mapNote {
    display: none; margin-top: 6px; padding: 4px 6px; border-radius: 4px;
    background: rgba(236,35,41,.14); border: 1px solid rgba(236,35,41,.45);
    font-size: 10px; font-weight: 700; letter-spacing: .3px; color: #ffb3b5;
  }
  #mapNote.on { display: block; }
  #mapLegend span.untracked i { opacity: .35; box-shadow: inset 0 0 0 1px #fff; }
  #mapLegend {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-top: 6px; font-size: 10px; font-weight: 700; letter-spacing: .3px;
  }
  #mapLegend span { display: flex; align-items: center; gap: 4px; opacity: .45; }
  #mapLegend span.on { opacity: 1; }
  #mapLegend i { width: 8px; height: 8px; border-radius: 50%; display: block; }
  @media (max-width: 700px) { #mapBox { bottom: 10px; left: 10px; transform: scale(.8);
                                        transform-origin: bottom left; } }

  /* scheduled-start countdown */
  #countdown {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: #141515; text-align: center;
  }
  #countdown .lbl { font-weight: 700; font-size: 18px; letter-spacing: 2px; opacity: .8; }
  #countdown .num { font-weight: 800; font-size: 64px; font-variant-numeric: tabular-nums; color: var(--crimson); }

  /* blocked-autoplay fallback */
  #tapStart {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    background: rgba(20,21,21,.88); text-align: center;
  }
  #tapStart .ply {
    width: 92px; height: 92px; border-radius: 50%;
    background: var(--crimson); color: #fff;
    font-size: 40px; line-height: 92px; padding-left: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,.6);
  }
  #tapStart .lbl { font-weight: 800; font-size: 20px; letter-spacing: 2px; }

  /* status banner — a black rectangle with no cue is untriageable in the field */
  #status {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    display: none; align-items: center; gap: 10px;
    background: rgba(20,21,21,.92); border: 1px solid rgba(255,255,255,.25);
    padding: 12px 20px; border-radius: 10px;
    font-weight: 700; font-size: 15px; letter-spacing: .5px; text-align: center;
  }
  #status.show { display: flex; }
  #status.err { border-color: var(--crimson); color: #ffd7d8; }

  /* ?diag=1 — playback telemetry for triaging a screen that will not play */
  #diag {
    position: absolute; top: 8px; left: 8px; display: none;
    background: rgba(0,0,0,.82); border: 1px solid rgba(255,255,255,.25);
    padding: 8px 10px; border-radius: 8px;
    font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.5;
    white-space: pre; text-align: left; pointer-events: none;
  }

  /* PIN-gated operator bar (?ctl=1) */
  #ctlBar {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
    background: rgba(20,21,21,.92); border: 1px solid rgba(255,255,255,.25);
    padding: 10px 12px; border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.5);
  }
  #ctlBar input {
    width: 76px; padding: 9px 10px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,.3); background: rgba(58,60,60,.9);
    color: #fff; font-family: inherit; font-weight: 700; font-size: 14px;
    letter-spacing: 2px; text-align: center;
  }
  #ctlBar button {
    padding: 9px 14px; border-radius: 8px; border: none; cursor: pointer;
    background: var(--crimson); color: #fff;
    font-family: inherit; font-weight: 800; font-size: 14px; letter-spacing: .5px;
  }
  #ctlBar button.gray { background: var(--gray); }
  #ctlBar #ctlMsg { font-size: 12px; font-weight: 700; opacity: .85; min-width: 70px; text-align: center; }
  #ctlBar #ctlPos {
    font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums;
    letter-spacing: .5px; padding: 6px 10px; border-radius: 8px;
    background: rgba(58,60,60,.9); border: 1px solid rgba(255,255,255,.2);
    white-space: nowrap;
  }
  #ctlBar #ctlPos .st { color: var(--crimson); margin-right: 8px; }
  #ctlBar #ctlPos.hold .st { color: #9ca3af; }
</style>
</head>
<body>
<div id="stage">
  <video id="vid" autoplay muted playsinline loop preload="auto"></video>
  <div id="topbar">
    <div id="liveBadge"><span class="dot"></span><span id="badgeTxt">LIVE</span></div>
    <div id="title">WRI UAS — Duluth</div>
    <div id="clock"></div>
  </div>
  <div id="soundChip">🔇 TAP FOR SOUND</div>
  <div id="status"></div>
  <div id="diag"></div>
  <div id="fsBtn" title="Fullscreen">⛶</div>
  <div id="qrBox">
    <img id="qrImg" alt="QR — watch on your phone">
    <div class="cap">WATCH ON YOUR PHONE</div>
  </div>
  <div id="mapBox">
    <canvas id="mapCv"></canvas>
    <div id="mapLegend"></div>
    <div id="mapNote"></div>
  </div>
  <div id="countdown">
    <div class="lbl">LIVE FEED BEGINS IN</div>
    <div class="num" id="cdNum">--:--</div>
  </div>
  <div id="tapStart">
    <div class="ply">▶</div>
    <div class="lbl">TAP TO START</div>
  </div>
  <div id="ctlBar">
    <span id="ctlPos"><span class="st">LIVE</span><span class="tm">--:-- / --:--</span></span>
    <input id="ctlPin" type="password" inputmode="numeric" placeholder="PIN" autocomplete="off">
    <button data-act="pause" class="gray">⏸ Pause</button>
    <button data-act="resume">▶ Resume</button>
    <button data-act="restart" class="gray">⟲ Restart</button>
    <span id="ctlMsg"></span>
  </div>
</div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var vid = document.getElementById('vid');
  var chip = document.getElementById('soundChip');

  // VERSIONED FILENAME, deliberately. The video was 'drill.mp4' for the Aug
  // test cut; swapping the bytes under the same URL left every phone that had
  // already scanned the QR playing the OLD video from its own HTTP cache, with
  // no way for the cache to know. A new name per drill defeats every cache
  // layer -- browser, CDN edge and any service worker -- at zero cost.
  vid.src = params.get('src') || './drill-2609duluth.mp4';
  if (params.get('title')) document.getElementById('title').textContent = params.get('title');

  // QR points at this page itself. Served as a LOCAL file: this used to be
  // fetched live from api.qrserver.com, so a restricted venue network or a slow
  // third party rendered a broken image and nobody in the room could scan it —
  // the one moment it has to work. qr.png is generated at build time and its
  // payload is decode-verified. Falls back to the remote service only if the
  // local file is missing (an older deploy).
  var qrBox = document.getElementById('qrBox');
  if (params.get('qr') === '0') {
    qrBox.style.display = 'none';
  } else {
    var qrImg = document.getElementById('qrImg');
    qrImg.onerror = function () {
      qrImg.onerror = null;
      qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=256x256&margin=1&data=' +
                  encodeURIComponent(location.origin + location.pathname);
    };
    qrImg.src = 'qr.png';
  }

  // clock (sells the live feel; updates every second)
  var clock = document.getElementById('clock');
  function tick() {
    clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  tick(); setInterval(tick, 1000);

  // drone streams are often video-only — hide the sound chip when no audio track
  var silent = false;
  vid.addEventListener('loadeddata', function () {
    setTimeout(function () {
      var has = (vid.audioTracks && vid.audioTracks.length > 0) ||
                (typeof vid.webkitAudioDecodedByteCount === 'number' && vid.webkitAudioDecodedByteCount > 0) ||
                vid.mozHasAudio === true;
      if (!has) { silent = true; chip.classList.add('hidden'); }
    }, 1500);
  });

  // blocked-autoplay fallback: some browsers (battery saver, Edge efficiency
  // mode, Firefox strict autoplay) block even muted autoplay — without this the
  // page is just a black screen with no cue that a tap fixes it.
  var tapStart = document.getElementById('tapStart');
  var holdPaused = false;   // paused on purpose by the operator control
  vid.addEventListener('loadeddata', function () {
    setTimeout(function () {
      if (vid.paused && !holdPaused &&
          document.getElementById('countdown').style.display !== 'flex') {
        tapStart.style.display = 'flex';
      }
    }, 1200);
  });
  vid.addEventListener('playing', function () { tapStart.style.display = 'none'; });

  // every failure below used to render as the same black rectangle: decode error,
  // dead network, unsupported codec, endless buffering. Name them on screen.
  var statusEl = document.getElementById('status');
  function showStatus(txt, isErr) {
    statusEl.textContent = txt;
    statusEl.classList.add('show');
    statusEl.classList.toggle('err', !!isErr);
  }
  function hideStatus() { statusEl.classList.remove('show', 'err'); }

  var ERRS = { 1: 'load aborted', 2: 'network', 3: 'decode failed', 4: 'source not supported' };
  vid.addEventListener('error', function () {
    var c = (vid.error && vid.error.code) || 0;
    showStatus('VIDEO ERROR ' + c + ' — ' + (ERRS[c] || 'unknown'), true);
  });
  vid.addEventListener('waiting', function () { if (!holdPaused) showStatus('BUFFERING…', false); });
  vid.addEventListener('stalled', function () { if (vid.readyState < 3) showStatus('BUFFERING…', false); });
  vid.addEventListener('playing', hideStatus);
  vid.addEventListener('canplay', hideStatus);
  setTimeout(function () {
    if (vid.readyState < 2 && !vid.error) showStatus('LOADING FEED…', false);
  }, 6000);

  // tap anywhere = unmute (autoplay policy requires starting muted);
  // subsequent taps toggle mute. Also retries play() in case autoplay was blocked.
  document.getElementById('stage').addEventListener('click', function () {
    if (tapStart.style.display === 'flex') {   // first tap just starts playback
      tapStart.style.display = 'none';
      if (!holdPaused) vid.play().catch(function () {});
      return;
    }
    if (vid.paused && !holdPaused) vid.play().catch(function () {});
    if (silent) return;
    vid.muted = !vid.muted;
    if (vid.muted) {
      chip.textContent = '🔇 TAP FOR SOUND';
      chip.classList.remove('hidden');
    } else {
      chip.classList.add('hidden');
    }
  });

  // wall-clock sync: every client (viewer panel + QR phones) seeks to the same
  // position computed from a shared anchor, so all screens show the same moment
  // (~1s, limited by device clock accuracy). State comes from the PIN-gated
  // control API (polled every 5s — live pause/resume/restart), falling back to
  // the static sync.json (polled every 60s) when the API is unreachable:
  //   {"mode":"loop","epoch":ISO}                 — synced loop, always "on air"
  //   {"mode":"loop","epoch":ISO,"pausedAt":ISO}  — frozen at (pausedAt-epoch)%dur
  //   {"mode":"scheduled","start":ISO}            — countdown until start
  // Disable per-client with ?sync=0.
  var CTL_URL = 'https://script.google.com/macros/s/AKfycbyBTYx3pujbZRSY_3MCTz9UjV0_2VRBlw4U8a00I5bKOGtB9_NnhsKB6dM5WAqJfq3J2w/exec';
  var syncCfg = null;
  var gasCfg = null, gasAt = 0;

  // Never trust the device clock. Wall-mounted panels and kiosk PCs routinely sit
  // days off (dead CMOS battery, no NTP, re-imaged), and a clock behind the epoch
  // makes elapsed negative -> a bogus seek target every single second. Both the
  // control API (`now`) and the github.io `Date` response header give us the real
  // time; the offset is applied to every sync calculation below.
  var clockOffset = 0;
  function now() { return Date.now() + clockOffset; }
  function adoptServerTime(iso, sentAt) {
    var srv = Date.parse(iso);
    if (isNaN(srv)) return;
    clockOffset = srv + (Date.now() - sentAt) / 2 - Date.now();
  }
  var cd = document.getElementById('countdown');
  var cdNum = document.getElementById('cdNum');
  var badge = document.getElementById('liveBadge');
  var badgeTxt = document.getElementById('badgeTxt');

  function fetchSync() {
    var t0 = Date.now();
    fetch('./sync.json?cb=' + t0, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) return null;
        // same-origin, so the Date header is readable: a free ~1s server clock
        if (!gasCfg) adoptServerTime(r.headers.get('date'), t0);
        return r.json();
      })
      .then(function (cfg) { if (cfg) syncCfg = cfg; })
      .catch(function () {});
  }
  function fetchCtl() {
    var t0 = Date.now();
    fetch(CTL_URL, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (cfg) {
        if (!cfg || !cfg.mode) return;
        gasCfg = cfg; gasAt = Date.now();
        if (cfg.now) adoptServerTime(cfg.now, t0);
      })
      .catch(function () {});
  }
  function currentCfg() {
    // control API wins while fresh; static sync.json is the fallback
    if (gasCfg && (Date.now() - gasAt) < 90000) return gasCfg;
    return syncCfg;
  }

  function fmt(sec) {
    sec = Math.max(0, Math.ceil(sec));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return (h ? h + ':' + p(m) : m) + ':' + p(s);
  }

  function setHold(on) {
    holdPaused = on;
    badge.classList.toggle('hold', on);
    badgeTxt.textContent = on ? 'STANDBY' : 'LIVE';
  }

  function mod(n, m) { return ((n % m) + m) % m; }

  // Drift correction. A hard seek is expensive: it flushes the decode pipeline and
  // forces a byte-range refetch of a 98MB file. Correcting 1.5s of drift that way
  // once per second is a death spiral on a slow client (smartboard OPS module also
  // rendering the ExB map) - seek, stall, drift further, seek again - and the panel
  // never survives long enough to paint a frame, so it just reads as a black screen.
  // So: ignore trivial drift, correct small drift by nudging playbackRate (invisible
  // on aerial footage), and reserve hard seeks for large gaps with a cooldown. A
  // client that still cannot hold sync gives up and free-runs a few seconds behind,
  // which is strictly better than a black screen.
  var SOFT_S = 0.4;          // below this, leave it alone
  var HARD_S = 6;            // above this, a seek is worth the cost
  var RELAX_HARD_S = 30;     // ...raised to this while relaxed (see below)
  var SEEK_COOLDOWN = 10000; // ms between hard seeks
  var MAX_RATE = 0.10;       // +/-10% playback rate authority
  var lastSeekAt = 0, seekCount = 0, seekWindowAt = 0, relaxedUntil = 0, lastDrift = 0;

  function setRate(r) {
    if (Math.abs(vid.playbackRate - r) > 0.005) {
      try { vid.playbackRate = r; } catch (e) {}
    }
  }

  function applySync() {
    var cfg = currentCfg();
    if (!cfg || !vid.duration || !isFinite(vid.duration)) return;
    var anchor = Date.parse(cfg.mode === 'scheduled' ? cfg.start : cfg.epoch);
    if (isNaN(anchor)) return;
    var elapsed = (now() - anchor) / 1000;
    if (cfg.mode === 'scheduled' && elapsed < 0) {   // not started yet
      vid.pause();
      cdNum.textContent = fmt(-elapsed);
      cd.style.display = 'flex';
      return;
    }
    if (cd.style.display === 'flex') cd.style.display = 'none';

    if (cfg.pausedAt) {                              // operator hold
      var at = mod((Date.parse(cfg.pausedAt) - anchor) / 1000, vid.duration);
      if (isNaN(at)) at = 0;
      if (!holdPaused) setHold(true);
      if (!vid.paused) vid.pause();
      setRate(1);
      if (!vid.seeking && Math.abs(vid.currentTime - at) > 1.5) vid.currentTime = at;
      return;
    }
    if (holdPaused) setHold(false);

    if (vid.paused && tapStart.style.display !== 'flex') vid.play().catch(function () {});

    // signed shortest distance to the target on the circular timeline;
    // positive = we are behind and need to catch up
    var want = mod(elapsed, vid.duration);
    var d = mod(want - vid.currentTime + vid.duration / 2, vid.duration) - vid.duration / 2;
    lastDrift = d;

    // mid-seek or starved of frames: touching currentTime now is what causes the spiral
    if (vid.seeking || vid.readyState < 3) return;

    if (Math.abs(d) <= SOFT_S) { setRate(1); return; }

    var nudge = 1 + Math.max(-MAX_RATE, Math.min(MAX_RATE, d / 20));

    // "Relaxed" only suppresses seeks for chronic small drift on a client that has
    // already proved it cannot hold sync. A large jump still gets a seek even while
    // relaxed, or an operator restart would never reach this screen.
    var relaxed = Date.now() < relaxedUntil;
    if (Math.abs(d) <= (relaxed ? RELAX_HARD_S : HARD_S)) { setRate(nudge); return; }
    if (Date.now() - lastSeekAt < SEEK_COOLDOWN) { setRate(nudge); return; }

    setRate(1);
    lastSeekAt = Date.now();
    // three hard seeks inside a minute means this client cannot hold sync at all;
    // stop fighting it for 5 minutes and let it play a little behind
    if (Date.now() - seekWindowAt > 60000) { seekWindowAt = Date.now(); seekCount = 0; }
    if (++seekCount >= 3) relaxedUntil = Date.now() + 300000;
    vid.currentTime = want;
  }

  // ?diag=1 — everything you need to tell a decode failure from a starved network
  // from a wrong clock, on the panel itself, without a keyboard or devtools.
  var diagOn = params.get('diag') === '1';
  var diagEl = document.getElementById('diag');
  function renderDiag() {
    var buf = '-';
    try {
      if (vid.buffered.length) {
        buf = fmt(vid.buffered.start(0)) + ' → ' + fmt(vid.buffered.end(vid.buffered.length - 1));
      }
    } catch (e) {}
    var q = vid.getVideoPlaybackQuality ? vid.getVideoPlaybackQuality() : null;
    var cfg = currentCfg();
    diagEl.textContent =
      'ready/net  ' + vid.readyState + ' / ' + vid.networkState + (vid.seeking ? '  SEEKING' : '') + '\n' +
      'video      ' + vid.videoWidth + '×' + vid.videoHeight +
                      '   dur ' + (vid.duration ? fmt(vid.duration) : '-') + '\n' +
      'position   ' + fmt(vid.currentTime) + (vid.paused ? '  PAUSED' : '') +
                      '   rate ' + vid.playbackRate.toFixed(2) + '\n' +
      'buffered   ' + buf + '\n' +
      'drift      ' + lastDrift.toFixed(2) + 's   seeks ' + seekCount +
                      (Date.now() < relaxedUntil ? '   SYNC RELAXED' : '') + '\n' +
      'clock off  ' + (clockOffset / 1000).toFixed(1) + 's\n' +
      'frames     ' + (q ? q.totalVideoFrames + ' shown / ' + q.droppedVideoFrames + ' dropped' : 'n/a') + '\n' +
      'state      ' + (cfg ? cfg.mode + (cfg.pausedAt ? ' (hold)' : '') : 'none') +
                      (gasCfg ? '  [api]' : '  [static]');
  }
  if (diagOn) { diagEl.style.display = 'block'; setInterval(renderDiag, 500); renderDiag(); }

  if (params.get('sync') !== '0') {
    fetchSync(); fetchCtl();
    setInterval(fetchSync, 60000);
    setInterval(fetchCtl, 5000);
    vid.addEventListener('loadedmetadata', applySync);
    setInterval(applySync, 1000);
  } else {
    setRate(1);
    fetchSync();   // still want the server clock for the diag readout
  }

  /* ── UAS minimap ────────────────────────────────────────────────────────
     track.json is produced by drill-uas/uas_drill.py from the DJI .SRT
     sidecars. It is sampled on the SAME meshed timeline as drill.mp4, so the
     marker is just a lookup on vid.currentTime — it inherits the wall-clock
     sync, the pause hold and the countdown with no extra plumbing.
     Entirely optional: any failure leaves the player exactly as it was. */
  (function () {
    if (params.get('map') === '0') return;
    var box = document.getElementById('mapBox'), cv = document.getElementById('mapCv'),
        legend = document.getElementById('mapLegend'), note = document.getElementById('mapNote');
    var TRK = null, IMG = null, MAXW = 230, W = 0, H = 0, RECENT = 60;

    function merc(lat) { return Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360)); }

    function project(lat, lon) {
      var b = TRK.bbox, y0 = merc(b[3]), y1 = merc(b[1]);
      return [(lon - b[0]) / (b[2] - b[0]) * W, (y0 - merc(lat)) / (y0 - y1) * H];
    }

    function activeDrone(t) {
      var cur = TRK.segments.length ? TRK.segments[0].drone : null;
      for (var i = 0; i < TRK.segments.length; i++) {
        if (TRK.segments[i].t <= t + 0.001) cur = TRK.segments[i].drone; else break;
      }
      return cur;
    }

    function draw() {
      if (!TRK || !cv.getContext) return;
      var g = cv.getContext('2d');
      var t = (vid.duration && isFinite(vid.currentTime)) ? vid.currentTime : 0;
      var i = Math.max(0, Math.min(Math.round(t * TRK.hz),
              (TRK.series[TRK.drones[0].id] || []).length - 1));
      var act = activeDrone(t);

      g.clearRect(0, 0, W, H);
      if (IMG) g.drawImage(IMG, 0, 0, W, H); else { g.fillStyle = '#1d2020'; g.fillRect(0, 0, W, H); }

      TRK.drones.forEach(function (d) {
        var pts = TRK.series[d.id] || [], on = d.id === act;
        // whole flight faint, the last RECENT seconds solid — reads as motion
        // without the trail growing into an unreadable scribble.
        [[0, i, .22, 1], [Math.max(0, i - RECENT * TRK.hz), i, on ? .95 : .4, on ? 2 : 1.2]]
          .forEach(function (seg) {
            g.beginPath(); g.strokeStyle = d.color; g.globalAlpha = seg[2];
            g.lineWidth = seg[3]; g.lineJoin = 'round';
            var started = false;
            for (var k = seg[0]; k <= seg[1]; k++) {
              var p = pts[k];
              if (!p) { started = false; continue; }
              var xy = project(p[0], p[1]);
              if (started) g.lineTo(xy[0], xy[1]); else { g.moveTo(xy[0], xy[1]); started = true; }
            }
            g.stroke();
          });

        var cur = pts[i];
        if (!cur) return;
        var xy = project(cur[0], cur[1]);
        g.globalAlpha = 1;
        if (on && cur[3] !== null && cur[3] !== undefined) {   // heading wedge
          var a = (cur[3] - 90) * Math.PI / 180, spread = 0.42;
          g.beginPath(); g.moveTo(xy[0], xy[1]);
          g.arc(xy[0], xy[1], 22, a - spread, a + spread); g.closePath();
          g.fillStyle = d.color; g.globalAlpha = .22; g.fill(); g.globalAlpha = 1;
        }
        g.beginPath(); g.arc(xy[0], xy[1], on ? 6 : 4, 0, 6.284);
        if (on) { g.fillStyle = d.color; g.fill(); g.lineWidth = 2; g.strokeStyle = '#fff'; g.stroke(); }
        else { g.lineWidth = 1.5; g.strokeStyle = d.color; g.globalAlpha = .75; g.stroke(); g.globalAlpha = 1; }
      });

      var actD = null;
      for (var q = 0; q < TRK.drones.length; q++) {
        if (TRK.drones[q].id === act) actD = TRK.drones[q];
      }
      Array.prototype.forEach.call(legend.children, function (el) {
        var id = el.getAttribute('data-id'), dd = null;
        for (var q = 0; q < TRK.drones.length; q++) {
          if (TRK.drones[q].id === id) dd = TRK.drones[q];
        }
        el.className = (id === act ? 'on ' : '') + (dd && dd.tracked === false ? 'untracked' : '');
      });
      // Say it outright when the feed on screen has no flight track, rather
      // than lighting up a legend entry that has no marker to point at.
      if (actD && actD.tracked === false) {
        note.textContent = '⚠ ' + String(actD.label).toUpperCase() + ' — no GPS on this aircraft';
        note.className = 'on';
      } else {
        note.className = '';
      }
    }

    fetch('track.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        if (!j || !j.drones || !j.drones.length) return;
        TRK = j;
        var b = j.bbox, latm = (b[1] + b[3]) / 2 * Math.PI / 180;
        var ar = ((b[2] - b[0]) * Math.cos(latm)) / Math.max(b[3] - b[1], 1e-9);
        W = MAXW; H = Math.round(MAXW / Math.max(ar, 0.35));
        if (H > 240) { H = 240; W = Math.round(240 * ar); }
        var dpr = window.devicePixelRatio || 1;
        cv.width = W * dpr; cv.height = H * dpr;
        cv.style.width = W + 'px'; cv.style.height = H + 'px';
        cv.getContext('2d').scale(dpr, dpr);
        legend.innerHTML = j.drones.map(function (d) {
          return '<span data-id="' + d.id + '"><i style="background:' + d.color + '"></i>' +
                 String(d.label).toUpperCase() + '</span>';
        }).join('');
        box.style.display = 'block';
        if (j.basemap) {
          IMG = new Image();
          IMG.onload = draw;
          IMG.onerror = function () { IMG = null; };   // plain field, still usable
          IMG.src = j.basemap;
        }
        draw();
        setInterval(draw, 250);
      })
      .catch(function () {});   // no track => no minimap, player unaffected
  })();

  // PIN-gated operator bar (?ctl=1): pause / resume / restart for every client
  if (params.get('ctl') === '1') {
    var bar = document.getElementById('ctlBar');
    var pinEl = document.getElementById('ctlPin');
    var msgEl = document.getElementById('ctlMsg');
    bar.style.display = 'flex';
    bar.addEventListener('click', function (e) { e.stopPropagation(); });
    try { pinEl.value = localStorage.getItem('dvCtlPin') || ''; } catch (err) {}
    // live readout: what every synced screen is showing right now
    // (this player is itself synced within ~1.5s, so read our own playhead)
    var posEl = document.getElementById('ctlPos');
    var posSt = posEl.querySelector('.st');
    var posTm = posEl.querySelector('.tm');
    setInterval(function () {
      if (!vid.duration) return;
      var cfg = currentCfg();
      if (cfg && cfg.mode === 'scheduled' && Date.parse(cfg.start) > now()) {
        posSt.textContent = 'COUNTDOWN';
        posEl.classList.add('hold');
        posTm.textContent = 'starts in ' + fmt((Date.parse(cfg.start) - now()) / 1000);
        return;
      }
      posSt.textContent = holdPaused ? 'STANDBY' : 'LIVE';
      posEl.classList.toggle('hold', holdPaused);
      posTm.textContent = fmt(vid.currentTime) + ' / ' + fmt(vid.duration);
    }, 1000);
    var msgT;
    function msg(t) {
      msgEl.textContent = t;
      clearTimeout(msgT);
      msgT = setTimeout(function () { msgEl.textContent = ''; }, 4000);
    }
    Array.prototype.forEach.call(bar.querySelectorAll('button'), function (btn) {
      btn.addEventListener('click', function () {
        var pin = pinEl.value.trim();
        if (!pin) { msg('enter PIN'); return; }
        msg('…');
        fetch(CTL_URL, { method: 'POST', body: JSON.stringify({ pin: pin, action: btn.dataset.act }) })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (res.error) {
              msg(res.error);
              if (res.error === 'bad pin') { try { localStorage.removeItem('dvCtlPin'); } catch (err) {} }
              return;
            }
            try { localStorage.setItem('dvCtlPin', pin); } catch (err) {}
            if (res.state) { gasCfg = res.state; gasAt = Date.now(); applySync(); }
            msg('✓ ' + btn.dataset.act);
          })
          .catch(function () { msg('offline'); });
      });
    });
  }

  document.getElementById('fsBtn').addEventListener('click', function (e) {
    e.stopPropagation();
    if (document.fullscreenElement) document.exitFullscreen();
    else document.getElementById('stage').requestFullscreen().catch(function () {});
  });
})();
</script>
</body>
</html>
